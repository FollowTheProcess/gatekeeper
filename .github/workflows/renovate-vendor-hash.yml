name: Post Renovate
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  update-vendor-hash:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Update Vendor Hash
        run: nix run nixpkgs#nix-update -- --flake --version=skip default

      - name: Commit Updated Flake
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update vendorHash" || echo "No change to vendorHash"
          git push
