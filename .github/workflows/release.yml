name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      packages: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Existing Tags
        run: git fetch --force --tags

      - name: Parse Release Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Docker Login (dockerhub)
        uses: docker/login-action@v4
        with:
          username: followtheprocess
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Draft Release
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.version.outputs.version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assume Release Upload Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RELEASE_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Generate Binary Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Generate Image Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/digests.txt

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Assume Deployment Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_IAM_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: --no-confirm-changeset --no-fail-on-empty-changeset --s3-bucket ${{ vars.DEPLOYMENT_S3_BUCKET }}
