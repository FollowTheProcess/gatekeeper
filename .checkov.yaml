framework:
  - all
download-external-modules: true
skip-check:
  - CKV_AWS_338  # Ensure CloudWatch retains logs for 1 year. Too expensive and not necessary
  - CKV_AWS_144  # Ensure that S3 buckets have cross-region replication enabled. Not necessary
  - CKV_AWS_158  # Ensure CloudWatch log groups are encrypted with KMS. Not really necessary
  - CKV2_AWS_62  # Ensure S3 buckets have event notifications enabled. Nope
  - CKV_AWS_116  # Ensure that AWS Lambda function is configured for a Dead Letter Queue. Not needed
  - CKV_AWS_173  # Encrypt Lambda env vars with a KMS CMK. Already encrypted, a CMK adds no value
  - CKV_AWS_28  # DynamoDB point-in-time recovery. NonceTable is ephemeral (TTL'd, regenerable), nothing to recover
  - CKV_AWS_119  # DynamoDB KMS CMK. CMK adds no value
  - CKV_DOCKER_7  # Non-latest base image tag. distroless/static is digest-pinned in practice and not the Lambda artifact
  - CKV_DOCKER_2  # HEALTHCHECK instruction. Meaningless for a distroless CLI/release binary, not a long-running service
  - CKV_DOCKER_3  # Non-root container user. Not the Lambda runtime, fixable via the :nonroot tag if we ever care
  - CKV_AWS_117  # Lambda in VPC. Unnecessary cost
